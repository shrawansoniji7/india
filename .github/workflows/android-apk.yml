name: Build Shravan AI Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai.html'
      - 'app/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        run: npx cap add android
      - name: Add camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '    <uses-permission android:name="android.permission.CAMERA" />'
          if marker not in s:
              s = s.replace('    <application', marker + chr(10) + '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' + chr(10) + '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' + chr(10) + '    <uses-feature android:name="android.hardware.camera" android:required="false" />' + chr(10) + '    <application', 1)
              p.write_text(s)
          print(p.read_text())
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shravan-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
